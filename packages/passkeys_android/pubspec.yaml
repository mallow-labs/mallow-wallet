name: passkeys_android
description: Android implementation of the passkeys plugin, vendored from Corbado's passkeys_android 2.15.0 with two changes. See README.md.
version: 2.15.0
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

flutter:
  plugin:
    implements: passkeys
    platforms:
      android:
        package: com.corbado.passkeys_android
        pluginClass: FlutterPasskeysPlugin
        dartPluginClass: PasskeysAndroid

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  passkeys_platform_interface: ^2.11.0
