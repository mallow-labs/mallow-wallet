      summary: Buy raffle tickets
      description: |-
        Builds a purchase of `ticketCount` tickets in the raffle at `raffleKey`, signed and paid for by `buyer`.

        Rejected with `400` when the raffle has ended or is sold out, when the purchase would push the wallet past the raffle's per-wallet `limit`, or past the hard cap of **40% of total tickets** per wallet.

        Holder-only raffles admit only wallets holding a whitelisted asset; a wallet that holds none is rejected with `400`.

        When the raffle is denominated in SOL, wrapped-SOL setup instructions (create the token account if needed, transfer, sync) are prepended automatically.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyTicketsTxRequest"
      responses:
        "200":
          description: Unsigned transaction(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/UnsignedTxResponse"
                required:
                  - result
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication failed: no valid credential was supplied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: API-key rate limit exceeded.
          content:
            application/json:
              schema:
