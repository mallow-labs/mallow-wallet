          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v2/tx/raffles/cancel:
    post:
      operationId: cancelRaffle
      tags:
        - Transactions (v2)
      summary: Cancel raffle
      description: |-
        Builds a transaction cancelling the raffle at `raffleKey` and returning the prize to `creator`.

        Only the wallet that created the raffle may cancel it. Tickets already sold are refundable to their buyers once the cancellation confirms.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRaffleTxRequest"
      responses:
        "200":
          description: Unsigned transaction(s).
