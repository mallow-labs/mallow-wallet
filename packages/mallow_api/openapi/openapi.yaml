        - whitelistConfig
      description: Per-buyer purchase stats for an edition listing, enough to gate a quantity picker from a single read.
    GetEditionPurchaseStatsV2Response:
      allOf:
        - $ref: "#/components/schemas/GetEditionPurchaseStatsResponse"
        - type: object
          properties:
            viewSlot:
              type: integer
              description: Slot the RPC served this read at. Present whether or not the account exists, so a `null` result can be ordered against the write slot of any account update the caller has seen elsewhere — absence at slot X only outranks a write at slot W when X >= W. When the response is backed by several reads, this is the oldest (minimum) of their slots.
          required:
            - viewSlot
      description: Per-buyer edition purchase stats, plus the slot the underlying reads were served at.
    GetEditionStateResponse:
      type:
        - object
        - "null"
      properties:
        tokenStandard:
          description: Token standard of the asset as a kebab-case string, e.g. `"nft"` or `"core-collection"`.
        isPrintableMasterEdition:
          type: boolean
          description: Whether this asset is a master edition that copies can still be printed from.
        supplyInfo:
          $ref: "#/components/schemas/SupplyInfo"
        parentEdition:
          type:
            - string
            - "null"
          description: Mint address of the master edition this print came from (base58). `null` unless the asset is itself an edition print.
        editionNumber:
          type:
            - integer
            - "null"
          description: This print's 1-based number within its edition run. `null` unless the asset is itself an edition print.
      required:
        - isPrintableMasterEdition
        - supplyInfo
        - parentEdition
        - editionNumber
      description: Edition state derived from the asset's on-chain metadata. `null` when the mint is not an indexed asset.
    GetRaffleStateResponse:
      type:
        - object
        - "null"
      properties:
        raffleAccount:
          type: string
          description: Address of the on-chain raffle account (base58).
        creator:
          type: string
          description: Wallet that created the raffle and receives the proceeds (base58).
        prizeMint:
          type: string
          description: Mint address of the artwork being raffled (base58).
        currencyMint:
          type: string
          description: Mint of the currency tickets are priced in (base58); wrapped SOL for SOL raffles.
        ticketPrice:
          type: integer
          description: Price of one ticket in the currency's base units.
        supply:
          type: integer
          description: Total number of tickets the raffle offers.
        sold:
          type: integer
          description: Number of tickets sold so far.
        ticketLimit:
          type: integer
          description: Per-wallet ticket cap configured on the raffle. `0` means unset — the 40%-of-supply hard cap still applies. See `walletLimit` on the per-buyer read for the effective ceiling.
        endTime:
          type:
            - string
            - "null"
          description: ISO 8601 timestamp when ticket sales close, or `null` when the raffle has no end time.
        winner:
          type:
            - string
            - "null"
          description: Winning wallet (base58), or `null` before the draw. Taken from the raffle's on-chain winner field, falling back to the drawn index into the entrants list.
        isPrizeClaimed:
          type: boolean
          description: Whether the winner has claimed the prize.
        isClaimed:
          type: boolean
          description: Whether the creator has collected the ticket proceeds. Inferred from the entrants account having been closed, which also empties `countByEntrant`.
        isExpired:
          type: boolean
          description: Whether the raffle passed its end time without selling a single ticket.
        countByEntrant:
          type: object
          additionalProperties:
            type: integer
          description: Tickets held per wallet, keyed by address. Derived from the entrants account, so it empties once the creator collects proceeds and that account is closed.
      required:
        - raffleAccount
        - creator
        - prizeMint
        - currencyMint
        - ticketPrice
        - supply
        - sold
        - ticketLimit
        - endTime
        - winner
        - isPrizeClaimed
        - isClaimed
        - isExpired
        - countByEntrant
      description: Decoded live raffle state. `null` when the raffle account does not exist — cancelled, or fully settled and closed.
