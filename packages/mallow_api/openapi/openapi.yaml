              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v2/tx/raffles/claim-prize:
    post:
      operationId: claimRafflePrize
      tags:
        - Transactions (v2)
      summary: Claim raffle prize
      description: |-
        Builds the transaction transferring a drawn raffle's prize to its winner, signed by `authority`.

        The raffle must have been drawn so a winner is resolvable from the entrants account; if that account is missing or the draw has not happened, the winner cannot be determined and the request fails. `authority` pays the transaction fee but need not be the winner — the prize always goes to the winning wallet recorded on-chain.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRafflePrizeTxRequest"
      responses:
        "200":
          description: Unsigned transaction(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/UnsignedTxResponse"
                required:
                  - result
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication failed: no valid credential was supplied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction build or RPC error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v2/tx/raffles/claim-proceeds:
    post:
      operationId: claimRaffleProceeds
      tags:
        - Transactions (v2)
      summary: Claim raffle proceeds
      description: |-
        Builds the transaction paying out a completed raffle's ticket revenue to `creator`, signed by them.

        Proceeds are split on-chain — the marketplace fee to the fee account the raffle was configured with, royalties to the creators recorded on-chain, and the remainder to `creator`. This is independent of prize delivery — `/v2/tx/raffles/claim-prize` moves the asset to the winner, this moves the money to the seller.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRaffleProceedsTxRequest"
      responses:
        "200":
          description: Unsigned transaction(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/UnsignedTxResponse"
                required:
                  - result
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication failed: no valid credential was supplied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction build or RPC error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v2/user/delete:
    post:
      tags:
        - Users
      summary: Delete (anonymize) the signed-in user's profile
      description: "Login required. Anonymizes the caller's profile: `roles` is emptied and `bannerUrl`, `bio`, `displayName`, `username`, `website`, `twitter`, `imageIndexedAt` and `imageUrl` are unset. The `users` row itself survives, as does everything indexed against the raw wallet address — artworks, curations, sale history and offers describe public on-chain events and are not removed. Registered device tokens are deleted, and the response clears the `login-token` cookie, but the client must still tear its own session down. POST rather than DELETE because it is an action on the caller's own session. No body."
      operationId: postV2UserDelete
      responses:
        "200":
          description: Profile anonymized; the `login-token` cookie is cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/EmptyObject"
                required:
                  - result
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user found for the signed-in address — nothing left to delete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to delete the profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - ApiKeyAuth: []
