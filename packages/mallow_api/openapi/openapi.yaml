openapi: 3.1.0
info:
  title: Mallow API
  version: 1.1.0
  description: |-
    OpenAPI contract for the Mallow REST API. Generated from the server's schema definitions; edit this vendored copy directly if you are changing the contract for your own backend.

    This document describes the operations the mallow mobile wallet calls. The mallow API serves others that are not described here; a deployment that implements this contract can run the app.

    Every operation declares the `ApiKeyAuth` caller credential, except the mobile-config read, which is served open so a client can always reach its kill switch. First-party mallow builds may instead present a build credential that is not described here; it is configured at build time and is not required to implement this contract.

    This document does not describe session authentication. Operations whose description says "Login required" require a session established by POST /v0/login or POST /v0/authToken/verify, and that requirement is stated in prose only — it is deliberately absent from the machine-readable security declarations. The `ApiKeyAuth` scheme below is real and is declared where it applies; the session requirement is not. Code generated from this document is therefore not an authentication model. Do not deploy generated server scaffolding without adding your own.
servers:
  - url: "https://api.example.com"
    description: Set API_BASE_URL to your own deployment; this app ships no default
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    AcceptOfferTxRequest:
      type: object
      properties:
        seller:
          type: string
          description: Wallet accepting the offer (base58). Must currently own the asset and signs the transaction.
        buyer:
          type: string
          description: Wallet whose outstanding offer is being accepted (base58).
        asset:
          type: string
          description: Mint address of the artwork being sold (base58).
        enablePrimarySplit:
          type: boolean
          description: Split the primary-sale proceeds among the on-chain creators by their shares. Omitted or `false` pays the seller instead, with royalties still going to the creators.
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - seller
        - buyer
        - asset
      description: Accepts an outstanding offer, transferring the asset and releasing the escrowed funds. If the asset is also listed at a fixed price by the same seller, a delist instruction is prepended automatically.
    AddCurationArtworkRequest:
      type: object
      properties:
        mintAccount:
          type: string
          minLength: 1
      required:
        - mintAccount
    ArtworkDetailResponseV1:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ArtworkDetailV1"
      required:
        - result
    ArtworkDetailV1:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/ArtworkPreview"
        collection: {}
        unclaimedRaffles:
          type: array
          items: {}
        highestOffer: {}
        offersCount:
          type: number
        userDetails: {}
        isFreePrint:
          type: boolean
        curations:
          type: array
          items: {}
        whitelistStatus:
          type: string
    ArtworkListResponseV1:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/ArtworkPreview"
        total:
          type: integer
        nextPage:
          type: integer
      required:
        - result
    ArtworkPreview:
      type: object
      properties:
        mintAccount:
          type: string
          description: Mint address of the artwork (base58). Use it to fetch full details.
        name:
          type: string
          description: Artwork title as shown on mallow.
        image:
          type: string
          description: URL of the artwork's preview image.
      required:
        - mintAccount
      description: Summary of an artwork, as returned in listing and discovery responses. Additional fields beyond those documented here may be present and will be added over time, so parse permissively.
    ArtworkSearchRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    ArtworkTxResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            tx:
              type: string
              description: base64-encoded serialized VersionedTransaction
          required:
            - tx
      required:
        - result
    ArtworkTxsResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            txs:
              type: array
              items:
                type: object
                properties:
                  mintAccount:
                    type: string
                  tx:
                    type: string
                required:
                  - tx
              description: Array of serialized transactions to sign and send in order. Empty when `swapTx` is present.
            swapTx:
              type: string
              description: "base64-encoded swap transaction. When present, the purchase could not be bundled with the swap: sign, send and confirm this transaction, then call this endpoint again with `swapQuote` omitted to get the purchase transactions."
            swapTxReason:
              type: string
              enum:
                - size
                - account-count
                - simulation
              description: Why the swap could not be bundled with the purchase. Present exactly when `swapTx` is.
          required:
            - txs
      required:
        - result
    AuctionConfigAccount:
      type:
        - object
        - "null"
      properties:
        accountType:
          type: string
          enum:
            - auctionConfig
          description: Discriminator identifying the decoded account type.
        bump:
          type: number
          description: PDA bump seed for this account.
        version:
          type: number
          description: Account schema version, incremented when the program changes the account layout.
        marketplaceAuthority:
          type: string
          description: Marketplace authority that governs this auction (base58).
        seller:
          type: string
          description: Wallet that created the auction and receives the proceeds (base58).
        mint:
          type: string
          description: Mint address of the artwork being auctioned (base58).
        bidMint:
          type: string
          description: Mint of the currency bids are denominated in (base58); wrapped SOL for SOL auctions.
        startTime:
          type: number
          description: Unix timestamp in seconds when the auction clock started. `0` when unset. An auction with no start time begins at its first bid.
        endTime:
          type: number
          description: Unix timestamp in seconds when bidding closes. `0` when unset.
        highestBidAmount:
          type: string
          description: Current highest bid in the bid currency's base units, as a decimal string. `"0"` when no bid has been placed. A string because u64 amounts can exceed JavaScript's safe-integer range.
        highestBidder:
          type: string
          description: Wallet holding the current highest bid (base58). The default pubkey (`11111111111111111111111111111111`) when unset.
        reservePrice:
          type: string
          description: Minimum accepted bid in the bid currency's base units, as a decimal string.
        duration:
          type: number
          description: Auction length in seconds, measured from the start.
        minBidIncrementBps:
          type: number
          description: Minimum bid step as basis points of the current bid. Ignored when `absoluteIncrement` is true, in which case `minBidIncrement` applies instead.
        timeExtPeriod:
          type: number
          description: "Anti-sniping window in seconds: a bid landing this close to the deadline extends it."
        timeExtDelta:
          type: number
          description: Seconds the deadline extends by when a bid lands inside `timeExtPeriod`.
        feeAccount:
          type: string
          description: Account that receives the marketplace fee on settlement (base58).
        feeBps:
          type: number
          description: Marketplace fee in basis points (100 = 1%).
        pausedAt:
          type: number
          description: Unix timestamp in seconds when the auction was paused. `0` when unset.
        burnOnComplete:
          type: boolean
          description: Whether the asset is burned rather than transferred when the auction completes.
        buyerAck:
          type: boolean
          description: Whether the winning bidder has acknowledged settlement.
        sellerAck:
          type: boolean
          description: Whether the seller has acknowledged settlement.
        tokenStandard:
          type: number
          description: "On-chain token standard discriminant: `0` = NonFungible (Token Metadata), `1` = Core."
        minBidIncrement:
          type: string
          description: Flat minimum bid step in the bid currency's base units, as a decimal string. Applies only when `absoluteIncrement` is true.
        absoluteIncrement:
          type: boolean
          description: Whether the bid step is the flat `minBidIncrement` rather than `minBidIncrementBps`.
        disablePrimarySplit:
          type: boolean
          description: Whether primary-sale proceeds splitting is disabled for this auction.
        pubkey:
          type: string
          description: This account's own address (base58) — the AuctionConfig PDA.
        program:
          type: string
          enum:
            - mallow-auction
          description: Program that owns this account.
      required:
        - accountType
        - bump
        - version
        - marketplaceAuthority
        - seller
        - mint
        - bidMint
        - startTime
        - endTime
        - highestBidAmount
        - highestBidder
        - reservePrice
        - duration
        - minBidIncrementBps
        - timeExtPeriod
        - timeExtDelta
        - feeAccount
        - feeBps
        - pausedAt
        - burnOnComplete
        - buyerAck
        - sellerAck
        - tokenStandard
        - minBidIncrement
        - absoluteIncrement
        - disablePrimarySplit
        - pubkey
        - program
      description: Raw decoded MallowAuction `AuctionConfig` account. Amounts and timestamps are the exact on-chain values (base units, unix seconds) rather than the curated forms the marketplace reads return. `null` when the account does not exist at the node's confirmed view.
    AuthTokenRequest:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          description: Wallet address the nonce is issued for. EVM addresses are canonicalized server-side.
      required:
        - address
    AuthTokenResponse:
      type: object
      properties:
        result:
          type: string
          description: Opaque nonce. Valid for 15 minutes and consumed by the first successful verify.
      required:
        - result
    AuthTokenVerifyRequest:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          description: The address that signed.
        message:
          type: string
          minLength: 1
          description: "The human-readable half of the signed payload. The server appends `\\n\\ntoken:<nonce>` before verifying, so sign that concatenation, not this string alone."
        signature:
          type: string
          description: Signature over the payload. Either this or `tx` is required.
        tx:
          type: string
          description: Serialized transaction carrying the payload in a memo instruction, for wallets that cannot sign arbitrary messages. Either this or `signature` is required.
        chain:
          type: string
          default: solana
          description: Which signature scheme to verify with. Defaults to Solana when omitted.
        publicKey:
          type: string
          description: Signing public key, where the address does not carry it (Tezos).
        timestamp:
          type: string
      required:
        - address
        - message
      oneOf:
        - required:
            - signature
        - required:
            - tx
    AuthTokenVerifyResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/AuthTokenVerifyResult"
      required:
        - result
    AuthTokenVerifyResult:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the session cookie stops being accepted.
        user:
          $ref: "#/components/schemas/LoginUser"
        userDetails:
          $ref: "#/components/schemas/LoginUserDetails"
      required:
        - expiresAt
    BidTxRequest:
      type: object
      properties:
        bidder:
          type: string
          description: Wallet placing the bid (base58). Signs and funds the transaction.
        asset:
          type: string
          description: Mint address of the artwork under auction (base58).
        bidAmount:
          type: integer
          description: Bid amount in the auction's bid currency base units. Must be a positive integer that clears both the reserve price and the current bid plus its minimum increment.
          format: uint64
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - bidder
        - asset
        - bidAmount
      description: Places a bid on an auction. The previous high bidder is refunded on-chain when this transaction confirms.
    BlockedAccount:
      type: object
      properties:
        address:
          type: string
          description: The blocked address, canonicalised.
        username:
          type: string
        displayName:
          type: string
        imageUrl:
          type: string
        createdAt:
          type: string
          description: ISO-8601 — when the block was created.
      required:
        - address
        - createdAt
      description: One row of the caller's block list, profile-hydrated so the management screen can render without a lookup per row. The profile fields are omitted when the address has no mallow user.
    BlockRequest:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          description: The address to block. Canonicalised server-side.
      required:
        - address
    BlockResponse:
      type: object
      properties:
        blocked:
          type: boolean
          description: The block state after the call — `true` from the block route, `false` from the unblock route.
      required:
        - blocked
    BugReport:
      type: object
      properties:
        reportId:
          type: string
          maxLength: 50
        message:
          type: string
          minLength: 1
          maxLength: 5000
        device:
          type: string
          maxLength: 200
        os:
          type: string
          maxLength: 100
        appVersion:
          type: string
          maxLength: 50
        platform:
          type: string
          maxLength: 50
        metadata:
          type: object
          additionalProperties: {}
      required:
        - message
    BugReportResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            id:
              type: string
            reportId:
              type: string
          required:
            - id
      required:
        - result
    BurnTxRequest:
      type: object
      properties:
        authority:
          type: string
          description: Wallet burning the asset (base58). Must be its current owner and is the only signer.
        asset:
          type: string
          description: Mint/asset address to burn (base58).
        tokenStandard:
          $ref: "#/components/schemas/TokenStandard"
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - authority
        - asset
        - tokenStandard
      description: Permanently destroys an asset and reclaims its rent. Accepts `nft`, `pnft`, `core` and `core-collection` only.
    BuyEditionTxItem:
      type: object
      properties:
        mintAccount:
          type: string
          description: Address the printed copy will occupy. This transaction is already partially signed for this specific mint, so entries are not interchangeable — use it to reconcile which print resulted once the transaction confirms.
        tx:
          type: string
          description: base64-encoded VersionedTransaction that prints this one copy.
      required:
        - mintAccount
        - tx
      description: "One edition print: the transaction that mints it, paired with the address it lands at."
    BuyEditionTxsRequest:
      type: object
      properties:
        buyer:
          type: string
          description: Wallet buying the prints (base58). Signs and pays for the transactions.
        masterEdition:
          type: string
          description: Mint address of the master edition being printed from (base58).
        quantity:
          type: integer
          description: Number of copies to print. Must be between 1 and 25.
          format: uint32
        maxPrice:
          type: integer
          description: Slippage guard, in the listing currency's base units. The build fails rather than filling if the listing price exceeds it.
          format: uint64
        orderId:
          type: string
          description: "Your own reference id, written to the transactions as an `order:<id>` memo for reconciliation."
        curationShareSlug:
          type: string
          pattern: ^[A-Z]{8}$
          description: "Share slug of the curation the buyer browsed the edition from, written to the transactions as a `curation:<slug>` memo for referral attribution."
        payWithCream:
          type: boolean
          description: Settle the print fee in Cream — mallow store credit, earned on the platform and spendable only within it, never a transferable token. Doing so makes the service the fee payer, so each returned transaction carries a second signature and must be sent exactly as returned.
        swapQuote:
          $ref: "#/components/schemas/JupiterQuote"
        whitelistMint:
          type: string
          description: Token mint the buyer must hold to pass a token-gated edition's allowlist (base58).
        whitelistCoreCollection:
          type: string
          description: Core collection the buyer must hold an asset from to pass the allowlist (base58).
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - buyer
        - masterEdition
        - quantity
      description: Prints copies of a master edition. Returns one transaction per copy, paid in the listing's currency. Supply a `swapQuote` only to pay with a different token, in which case it must cover the listing price plus estimated SOL fees.
    BuyEditionTxsResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/BuyEditionTxItem"
        setupTx:
          type: string
          description: "base64-encoded prerequisite transaction, present only when the buyer needs an allowlist-proof account created first: a wallet-allowlisted listing, inside its allowlist phase, for a buyer who does not have one yet. When present, sign and confirm it before broadcasting anything in `result` — those transactions reference the account it creates and will fail if sent first. The buyer is its fee payer and only signer."
      required:
        - result
      description: One transaction per printed copy, plus the optional allowlist-proof setup transaction that must be confirmed before them.
    BuyFixedPriceTxRequest:
      type: object
      properties:
        buyer:
          type: string
          description: Wallet making the purchase (base58). Signs and pays for the transaction.
        asset:
          type: string
          description: Mint address of the listed artwork (base58).
        maxPrice:
          type: integer
          description: Slippage guard, in the listing currency's base units. The build fails rather than filling if the listing price exceeds it.
          format: uint64
        orderId:
          type: string
          description: "Your own reference id, written to the transaction as an `order:<id>` memo for reconciliation."
        curationShareSlug:
          type: string
          pattern: ^[A-Z]{8}$
          description: "Share slug of the curation the buyer browsed the artwork from, written to the transaction as a `curation:<slug>` memo for referral attribution."
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
        swapQuote:
          $ref: "#/components/schemas/JupiterQuote"
      required:
        - buyer
        - asset
      description: Buys a listed artwork at its listed price, paid in the listing's currency. Supply a `swapQuote` only to pay with a different token; its `outputMint` must match the listing currency and cover the price.
    BuyTicketsTxRequest:
      type: object
      properties:
        buyer:
          type: string
          description: Wallet buying the tickets (base58). Signs and pays for the transaction.
        raffleKey:
          type: string
          description: Address of the raffle account (base58).
        ticketCount:
          type: integer
          description: Number of tickets to buy. Rejected if it would push the wallet past the raffle's per-wallet limit, or past the hard cap of 40% of total tickets.
          format: uint32
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - buyer
        - raffleKey
        - ticketCount
      description: Buys raffle tickets. For SOL-denominated raffles, wrapped-SOL setup instructions are prepended automatically.
    CancelAuctionTxRequest:
      type: object
      properties:
        seller:
          type: string
          description: Wallet that created the auction (base58). The asset is returned to it.
        asset:
          type: string
          description: Mint address of the artwork under auction (base58).
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - seller
        - asset
      description: Cancels an auction and returns the asset to the seller. Only possible while the auction has no bids — once a bid is placed the auction is binding and must be settled instead.
    CancelFixedPriceTxRequest:
      type: object
      properties:
        seller:
          type: string
          description: Wallet that created the listing (base58). The asset is returned to it.
        asset:
          type: string
          description: Mint address of the listed artwork (base58).
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - seller
        - asset
      description: Delists an artwork. Any escrowed listing state is closed and its rent returned in the same transaction.
    CancelOfferTxRequest:
      type: object
      properties:
        buyer:
          type: string
          description: Wallet that created the offer (base58). The escrowed funds are refunded to it.
        asset:
          type: string
          description: Mint address the offer was made on (base58). Must match the offer, or the request is rejected.
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - buyer
        - asset
      description: Closes an open offer and refunds the escrowed funds to the buyer.
    CancelRaffleTxRequest:
      type: object
      properties:
        creator:
          type: string
          description: Wallet that created the raffle (base58). Only it may cancel; the prize is returned to it.
        raffleKey:
          type: string
          description: Address of the raffle account (base58).
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - creator
        - raffleKey
      description: Cancels a raffle and returns the prize to its creator. Tickets already sold become refundable to their buyers once the cancellation confirms.
    Chain:
      type: string
      enum:
        - solana
