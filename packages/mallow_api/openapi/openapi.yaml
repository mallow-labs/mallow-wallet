  /v2/tx/assets/burn:
    post:
      operationId: burnAsset
      tags:
        - Transactions (v2)
      summary: Burn
      description: |-
        Builds a transaction that permanently destroys an asset and reclaims its rent to `authority`, which must be the current owner and is the only signer.

        Supported `tokenStandard` values are `nft`, `pnft`, `core` and `core-collection`. Collection membership and printed-edition parentage are resolved on-chain, so neither needs to be supplied — but printed-edition burns work for `nft` only, not `pnft`. The `cnft`, `cnft-v2`, `objkt`, `native`, `erc20`, `erc721` and `erc1155` standards are rejected with a `400`.

        Burning is irreversible and there is no on-chain confirmation step beyond your signature.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BurnTxRequest"
      responses:
        "200":
          description: Unsigned transaction(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/UnsignedTxResponse"
                required:
                  - result
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication failed: no valid credential was supplied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction build or RPC error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v2/tx/assets/transfer:
    post:
      operationId: transferAsset
      tags:
        - Transactions (v2)
      summary: Transfer
      description: |-
        Builds a transfer of `asset` from `authority` to `recipient`.

        The response is chain-dependent and exactly one field is present. Solana standards return a base64 `tx`. EVM standards (`native`, `erc20`, `erc721`, `erc1155`) instead return an `evm` object with `to`, `data`, `value` and an advisory `gasLimit` — fill in the nonce and EIP-1559 fees, then sign and broadcast it as an ordinary EVM transaction. When `gasLimit` is absent, estimate it client-side.

        EVM NFTs are addressed as `<contract>-<tokenId>`. `amount` is the amount in the token's smallest unit as a decimal **string** — because these are uint256 values that overflow a 64-bit integer — wei for `native`, token base units for `erc20`, and the token count for `erc1155` (defaults to `1`). It is ignored for standards that are always 1-of-1 (every Solana standard, plus `erc721`). `objkt` is not supported on this route.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferTxRequest"
      responses:
        "200":
          description: Unsigned transaction(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/TransferTxResponse"
                required:
                  - result
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication failed: no valid credential was supplied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction build or RPC error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v2/tx/nft/mint:
    post:
      operationId: mintAsset
      tags:
        - Transactions (v2)
      summary: Mint
      description: |-
        Builds a Metaplex Core mint, paid for and signed by `authority`. `asset` is the address the new asset will occupy.

        The `kind` discriminator selects what is minted:

        - `core_asset` — a 1/1, optionally placed into `collection`.
        - `core_master_edition_collection` — a printable master edition. Omit `maxSupply` for an open edition; set it to cap the print run.
        - `core_collection` — a parent collection that other assets can join.

        The returned transaction may already carry a second signature, from an account the server pays the group-account rent with instead of charging `authority`. Whether that happens is a deployment policy rather than part of this contract, so treat it as an output — sign and broadcast the transaction exactly as returned, and do not rebuild it from its instructions.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintNftTxRequest"
      responses:
        "200":
          description: Unsigned transaction(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/UnsignedTxResponse"
                required:
                  - result
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication failed: no valid credential was supplied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
