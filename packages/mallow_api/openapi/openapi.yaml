        - nft
        - collection
        - editNft
        - editCollection
      description: Which staged upload is being finalized — a new asset, a new collection, or an edit to either.
    UserBulkRequest:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: string
          maxItems: 50
      required:
        - addresses
    UserPreview:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: string
        username:
          type: string
        displayName:
          type: string
        website:
          type: string
        twitter:
          type: object
          properties:
            username:
              type: string
        bio:
          type: string
        imageUrl:
          type: string
        bannerUrl:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
        - addresses
    UserWithDetailsRequest:
      type: object
      properties:
        user:
          type: object
          properties:
            addresses:
              type: array
              items:
                type: string
              description: Look up by wallet address. The first entry is used.
            username:
              type: string
              description: Look up by mallow username, when no address is known.
          description: Supply one of the two — an address, or a username.
          oneOf:
            - required:
                - addresses
            - required:
                - username
      required:
        - user
    UserWithDetailsResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/UserWithDetailsResult"
      required:
        - result
    UserWithDetailsResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/LoginUser"
        userDetails:
          $ref: "#/components/schemas/LoginUserDetails"
        isArtwork:
          type: boolean
          description: True when the profile's display name and image were taken from a profile artwork rather than set directly.
      required:
        - user
    VerifyOtpRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
      required:
        - code
    WalletAddressBody:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          description: The wallet address to act on.
      required:
        - address
    WhitelistEligibilityRequest:
      type: object
      properties:
        merkleRoots:
          type: array
          items:
            type: string
          description: The phases to test, by Merkle root.
        address:
          type: string
          minLength: 1
          description: Wallet address to test.
      required:
        - merkleRoots
        - address
    WhitelistEligibilityResponse:
      type: object
      properties:
        result:
          type: array
          items:
            type: string
          description: The subset of the requested roots this address is on. Empty means excluded from every phase in the request.
      required:
        - result
    WhitelistPhase:
      type:
        - object
        - "null"
      properties:
        walletsRoot:
          type: string
          description: Merkle root of the allowlisted wallet set (base58).
        durationSec:
          type: integer
          description: Length of the whitelist phase in seconds, measured from the listing's start time.
        isActive:
          type: boolean
          description: Whether the whitelist phase is in effect right now. Computed server-side from the listing's start time, this duration and the listing's end time, so it is a point-in-time answer rather than stored state.
      required:
        - walletsRoot
        - durationSec
        - isActive
      description: The early-access phase of an edition sale, during which only allowlisted wallets may buy.
  parameters: {}
paths:
  /v1/artwork/updateOwner:
    post:
      tags:
        - Artworks
      summary: Refresh the database owner of a mint
      description: Re-reads the on-chain owner for the given mint and updates the stored record when it differs.
      operationId: postV1ArtworkUpdateOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnerRequest"
      responses:
        "200":
          description: Owner refresh attempted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyOk"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - ApiKeyAuth: []
  /v1/artwork/byMint/{mintAccount}:
    get:
      tags:
        - Artworks
      summary: Artwork detail by mint account
      description: Returns full artwork detail including collection, offers, last sale, curations, and unlockable content references.
      operationId: getV1ArtworkByMintByMintAccount
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: mintAccount
          in: path
      responses:
        "200":
          description: Artwork detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkDetailResponseV1"
        "404":
          description: Artwork not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - ApiKeyAuth: []
  /v1/artwork/byOwner/{owner}:
    post:
      tags:
        - Artworks
      summary: Search artworks by owner
      description: Paginated; returns artworks currently owned by the given address (filtered to on-chain reality).
      operationId: postV1ArtworkByOwnerByOwner
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
