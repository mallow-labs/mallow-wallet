          description: Rows excluded across all pages because the offer/bid was made by an account the caller has blocked. `0` when the caller is anonymous or has blocked nobody. Reported rather than silently absent, so a caller can disclose the omission instead of showing a short page with no explanation.
      required:
        - result
        - total
        - hiddenByBlockCount
      description: The paged inbox. It sits inside the standard `{ result }` envelope rather than replacing it, so the row array is at `result.result`.
    OffersInboxRequest:
      type: object
      properties:
        owners:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          description: Owner wallets to build the inbox for. De-duped server-side.
        sort:
          $ref: "#/components/schemas/OffersInboxSort"
        page:
          type: integer
          minimum: 0
          description: 0-based page index.
        pageSize:
          type: integer
          minimum: 1
          default: 30
          description: Defaults to 30, capped at 50.
      required:
        - owners
        - sort
        - page
      description: Wallets + paging for the aggregated inbox. `owners` is array-only (no path param) because the wallet unions the active session wallets into one feed.
    OffersInboxSort:
      type: string
      enum:
        - latest
        - oldest
        - amount
      description: Sort applied to the merged offer+bid set. `amount` sorts by normalized USD value, so rows in different currencies compare correctly.
