  /v2/accounts/auction/auction-config/{address}:
    get:
      operationId: auctionConfigAccount
      tags:
        - Accounts
      summary: Auction config account
      security:
        - ApiKeyAuth: []
      description: Fetches the raw on-chain account from the RPC (at confirmed commitment) and returns it parsed, wrapped in a { viewSlot, account } envelope. An absent account is a 200 with a null account — viewSlot lets a client order that absence against the write slot of any account update it has seen elsewhere.
      parameters:
        - schema:
            type: string
            minLength: 1
            description: AuctionConfig account address (base58). A PDA of the MallowAuction program, derived from seeds `[mint, "auction_config"]` — so it is computable from the artwork mint alone.
          required: true
          description: AuctionConfig account address (base58). A PDA of the MallowAuction program, derived from seeds `[mint, "auction_config"]` — so it is computable from the artwork mint alone.
          name: address
          in: path
      responses:
        "200":
          description: "Decoded raw account, or `account: null` when the account does not exist at the node's confirmed view. `viewSlot` is the RPC response context slot for the read."
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      viewSlot:
                        type: integer
                        description: Slot the RPC served this read at. Present whether or not the account exists, so a `null` account can be ordered against the write slot of any account update the caller has seen elsewhere — absence at slot X only outranks a write at slot W when X >= W.
                      account:
                        $ref: "#/components/schemas/AuctionConfigAccount"
                    required:
                      - viewSlot
                      - account
                required:
                  - result
        "400":
          description: Invalid address, or unknown program/account-type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Authentication failed: no valid credential was supplied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The address decodes to a different program/account-type than the path (absence of the account itself is a 200 with a null account).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: RPC error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
