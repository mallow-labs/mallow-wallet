        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuctionTxRequest"
      responses:
        "200":
          description: Unsigned transaction(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/UnsignedTxResponse"
                required:
