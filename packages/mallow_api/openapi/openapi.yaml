    MintNftTxRequest:
      allOf:
        - type: object
          properties:
            authority:
              type: string
              description: Wallet minting the asset (base58). Signs and pays for the transaction.
            asset:
              type: string
              description: Address the new asset will occupy (base58). Generate a fresh keypair for it — the transaction is built for this exact address and must also be signed by it.
            uri:
              type: string
              description: URI of the off-chain JSON metadata, written to the on-chain metadata account.
            nftMetadata:
              $ref: "#/components/schemas/EditNftMetadata"
            createType:
              type: string
              description: Provenance label recorded against the mint by the client that requested it.
            paymentMethod:
              $ref: "#/components/schemas/PaymentMethod"
            unlockableContentIds:
              type: array
              items:
                type: integer
              description: Ids of mallow unlockable-content records to attach, revealed to the owner after purchase.
            targetPriorityFeeLamports:
              type: integer
              description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
              format: uint64
            blockhash:
              type: string
              description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
            dryRun:
              type: boolean
              description: Validate and price the mint without building a transaction. No transaction is returned.
          required:
            - authority
            - asset
            - uri
            - nftMetadata
        - oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - core_asset
                  description: Mint a 1/1 asset.
                collection:
                  $ref: "#/components/schemas/EditNftCollectionRef"
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - core_master_edition_collection
                  description: Mint a printable master edition that buyers mint copies from.
                maxSupply:
                  type: integer
                  description: Maximum number of prints. Omit for an open edition with no cap.
                collection:
                  $ref: "#/components/schemas/EditNftCollectionRef"
                groupSigner:
                  type: string
                  description: Keypair address co-signing the Core group operation, when the edition joins a group.
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - core_collection
                  description: Mint a parent collection that other assets can join.
              required:
                - kind
      description: Mints a Metaplex Core asset. The `kind` discriminator selects what is minted and which of the remaining fields apply.
