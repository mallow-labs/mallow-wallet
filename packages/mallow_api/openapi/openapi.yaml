        - thumbnailUrl
        - bundledContentIds
    UnlockableContentUploadForm:
      type: object
      properties:
        newAssetFilesCount:
          type: string
        existingAssetUrlsCount:
          type: string
    UnsignedTxResponse:
      type: object
      properties:
        tx:
          type: string
          description: base64-encoded serialized VersionedTransaction
      required:
        - tx
      description: An unsigned Solana transaction. Deserialize it, sign it with the wallet named in the request, and broadcast it yourself — mallow neither signs nor sends it. The embedded blockhash expires in roughly 60 seconds, so rebuild rather than retry a stale one.
    UpdateFixedPriceTxRequest:
      type: object
      properties:
        seller:
          type: string
          description: Wallet that created the listing (base58). Signs the transaction.
        asset:
          type: string
          description: Mint address of the listed artwork (base58).
        newPrice:
          type: integer
          minimum: 1
          description: Replacement price in the listing currency's base units.
          format: uint64
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - seller
        - asset
        - newPrice
      description: Reprices an existing listing. Nothing else changes — currency, timing, edition limit and whitelist configuration are preserved.
    UpdateMetadataRequest:
