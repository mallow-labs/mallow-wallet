    GetAuctionStateResponse:
      type:
        - object
        - "null"
      properties:
        auctionAccount:
          type: string
          description: Address of the on-chain AuctionConfig account (base58).
        seller:
          type: string
          description: Wallet that created the auction and receives the proceeds (base58).
        bidMint:
          type: string
          description: Mint of the currency bids are denominated in (base58); wrapped SOL for SOL auctions.
        reservePrice:
          type: integer
          description: Minimum accepted bid, in the bid currency's base units.
        currentBidAmount:
          type:
            - integer
            - "null"
          description: Current highest bid in the bid currency's base units, or `null` when no bid has been placed.
        currentBidder:
          type:
            - string
            - "null"
          description: Wallet holding the current highest bid (base58), or `null` when no bid has been placed.
        bidCount:
          type: integer
          description: Number of bids placed so far. Derived from ingested chain history rather than from the auction account (the program does not track it), so it can lag the on-chain bid state by a moment.
        startsAt:
          type:
            - string
            - "null"
          description: ISO 8601 timestamp when the auction clock started, or `null` when it has no start time — such an auction begins at its first bid.
        endsAt:
          type:
            - string
            - "null"
          description: ISO 8601 timestamp when bidding closes, or `null` when the auction has no end time.
        isSettled:
          type: boolean
          description: "Always `false` on this read: settlement closes the AuctionConfig account, and a closed account is reported as a null auction instead."
      required:
        - auctionAccount
        - seller
        - bidMint
        - reservePrice
        - currentBidAmount
        - currentBidder
        - bidCount
        - startsAt
        - endsAt
        - isSettled
      description: Decoded live auction state. `null` when no AuctionConfig exists for the mint — it was never created, or it was settled or cancelled and the account closed.
    GetBidTxRequest:
      type: object
      properties:
        mintAccount:
          type: string
          minLength: 1
        bidAmount:
          type: number
        latestBlockhashAndContext: {}
        targetPriorityFeeLamports:
          type: number
      required:
        - mintAccount
        - bidAmount
    GetBuyEditionTxsRequest:
      type: object
      properties:
        masterEditionMintAccount:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        targetPriorityFeeLamports:
          type: number
        payWithCream:
          type: boolean
          description: Settle the print fee in Cream — mallow store credit, earned on the platform and spendable only within it, never a transferable token. Doing so makes the service the fee payer, so each returned transaction carries a second signature and must be sent exactly as returned.
        maxPrice:
          type: number
        whitelistWallets:
          type: array
          items:
            type: string
        whitelistConfig:
          type: object
          properties:
            walletsRoot:
              type: string
          required:
            - walletsRoot
        whitelistMint:
          type: string
        whitelistCoreCollection:
          type: string
        swapQuote: {}
        orderId:
          type: string
      required:
        - masterEditionMintAccount
        - quantity
        - targetPriorityFeeLamports
    GetEditionPurchaseStatsResponse:
      type: object
      properties:
        buyCount:
          type: integer
          description: How many copies this buyer has already printed from the listing. `0` if they have bought none.
        walletLimit:
          type: integer
          description: Maximum copies any one wallet may print from this listing, taken from the listing's editions limit.
        whitelistConfig:
          $ref: "#/components/schemas/WhitelistPhase"
      required:
