          type: string
          description: Which marketplace the event came from.
        chain:
          type: string
        buyerSetsPrice:
          type: boolean
          description: "Set-your-own-price listing: `price` is the amount one buyer named, not an amount the seller asked for. Rendering it as a plain price states an asking price that never existed."
