          format: uint32
        timeExtDelta:
          type: integer
          description: Seconds the deadline is pushed out by when a bid lands inside `timeExtPeriod`.
          format: uint32
        bidMint:
          type: string
          default: So11111111111111111111111111111111111111112
          description: SPL token mint bids are denominated in (base58). Defaults to SOL when omitted.
        memo:
          type: string
          description: Free-form note written on-chain alongside the auction.
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
