    ListingAccount:
      type:
        - object
        - "null"
      properties:
        accountType:
          type: string
          enum:
            - listing
          description: Discriminator identifying the decoded account type.
        bump:
          type: number
          description: PDA bump seed for this account.
        version:
          type: number
          description: Account schema version, incremented when the program changes the account layout.
        marketplaceAuthority:
          type: string
          description: Marketplace authority that governs this listing (base58).
        seller:
          type: string
          description: Wallet that created the listing and receives the proceeds (base58).
        mint:
          type: string
          description: Mint address of the listed artwork (base58).
        currencyMint:
          type: string
          description: Mint of the currency the listing is priced in (base58); wrapped SOL for SOL listings.
        price:
          type: string
          description: Listing price in the currency's base units, as a decimal string. A string because u64 amounts can exceed JavaScript's safe-integer range. With `buyerSetsPrice`, this is the minimum rather than the exact price.
        endTime:
          type: number
          description: Unix timestamp in seconds when the listing expires. `0` when unset.
        listedAt:
          type: number
          description: Unix timestamp in seconds when the listing was created.
        feeAccount:
          type: string
          description: Account that receives the marketplace fee on sale (base58).
        feeBps:
          type: number
          description: Marketplace fee in basis points (100 = 1%).
        startTime:
          type: number
          description: Unix timestamp in seconds when the listing becomes active. `0` when unset.
        whitelistConfig:
          type: string
          description: Address of the WhitelistConfig account gating this listing (base58). The default pubkey (`11111111111111111111111111111111`) when unset.
        buyerSetsPrice:
          type: boolean
          description: Whether buyers may pay any amount at or above `price`.
        editionsLimit:
          type: number
          description: For master-edition listings, how many prints this listing offers. `0` on 1/1 listings.
        nonCustodial:
          type: boolean
          description: Whether the asset stays in the seller's wallet rather than being escrowed by the marketplace program for the duration of the listing.
        tokenStandard:
          type: number
          description: "On-chain token standard discriminant: `0` = NonFungible (Token Metadata), `1` = Core."
        disablePrimarySplit:
          type: boolean
          description: Whether primary-sale proceeds splitting is disabled for this listing.
        pubkey:
          type: string
          description: This account's own address (base58) — the Listing PDA.
        program:
          type: string
          enum:
            - mallow-market
          description: Program that owns this account.
      required:
        - accountType
        - bump
        - version
        - marketplaceAuthority
        - seller
        - mint
        - currencyMint
        - price
        - endTime
        - listedAt
        - feeAccount
        - feeBps
        - startTime
        - whitelistConfig
        - buyerSetsPrice
        - editionsLimit
        - nonCustodial
        - tokenStandard
        - disablePrimarySplit
        - pubkey
        - program
      description: Raw decoded MallowMarket `Listing` account. Amounts and timestamps are the exact on-chain values (base units, unix seconds). `null` when the account does not exist at the node's confirmed view — which is also how a sold or cancelled listing reads.
