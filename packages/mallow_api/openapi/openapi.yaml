    SettleAuctionTxRequest:
      type: object
      properties:
        authority:
          type: string
          description: Wallet signing and paying for the settlement (base58). Need not be the seller — anyone may settle an ended auction that has a winner. When the auction ended with no bids, only the seller may call it.
        asset:
          type: string
          description: Mint address of the artwork under auction (base58).
        orderId:
          type: string
          description: "Your own reference id, written to the transaction as an `order:<id>` memo for reconciliation."
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - authority
        - asset
      description: "Closes out an ended auction: transfers the asset to the winning bidder and distributes proceeds. With no bids, it instead builds the reclaim path returning the asset to the seller."
    ShowNsfwRequest:
      type: object
      properties:
        value:
          type: boolean
      required:
        - value
    ShowNsfwResponse:
      type: object
      properties:
        result:
          type: boolean
      required:
        - result
    StakingGetClaimTxRequest:
      type: object
      properties:
        amount:
          type: integer
          minimum: 1
        latestBlockhashAndContext: {}
        targetPriorityFeeLamports:
          type: number
      required:
        - amount
    SupplyInfo:
      type: object
      properties:
        supply:
          type: integer
          description: Number of copies printed so far.
        maxSupply:
          type:
            - integer
            - "null"
          description: Maximum number of copies that may be printed, or `null` for an open edition with no cap.
      required:
        - supply
        - maxSupply
      description: Print-run counts for an edition.
    TokenPricesResponse:
      type: object
      properties:
        result:
          type: object
          additionalProperties:
            type: string
          description: Latest USD price keyed by token mint address.
          example:
            So11111111111111111111111111111111111111112: "152.34"
      required:
        - result
    TokenStandard:
      type: string
      enum:
        - nft
        - core
        - core-collection
        - pnft
        - cnft
        - cnft-v2
        - objkt
        - native
        - erc20
        - erc721
        - erc1155
      description: "Asset standard, which selects the program the transaction is built against. Solana: `nft` (Token Metadata), `pnft` (programmable NFT), `cnft` (Bubblegum compressed), `cnft-v2` (Bubblegum v2 compressed), `core` / `core-collection` (Metaplex Core). `objkt` is a Tezos asset. EVM: `native`, `erc20`, `erc721`, `erc1155`. Individual endpoints accept only a subset — an unsupported standard is rejected with a `400`. `cnft-v2` is reported by the read endpoints but is not yet accepted by any transaction builder."
    TransferTxRequest:
      type: object
      properties:
        authority:
          type: string
          description: Wallet sending the asset (base58 on Solana, 0x address on EVM). Signs the transaction.
        asset:
          type: string
          description: Asset to transfer. A mint address on Solana; on EVM, the `<contract>-<tokenId>` pair for erc721/erc1155 or the token contract for erc20.
        recipient:
          type: string
          description: Wallet receiving the asset.
        tokenStandard:
          $ref: "#/components/schemas/TokenStandard"
        amount:
          type: string
          description: Amount in the token's smallest unit, as a decimal string — wei for `native`, token base units for `erc20`, token count for `erc1155` (defaults to `1`). Ignored for every Solana standard and `erc721`, which are always 1-of-1. A string rather than a number because these are uint256 values that overflow a 64-bit integer.
        targetPriorityFeeLamports:
          type: integer
          description: Total priority fee to target for this transaction, in lamports. The builder derives the compute-unit price from it and the transaction's compute budget. Omit to let mallow pick a fee from current network conditions.
          format: uint64
        blockhash:
          type: string
          description: Recent blockhash to stamp onto the transaction, base58. Omit to let mallow supply one — mallow's is cached for up to 10 seconds, so two identical requests inside that window compile the same transaction, with the same signature once signed. Supply your own to control the expiry window, or when otherwise-identical requests must produce distinct transactions. Rejected with a `400` if it is not valid base58; a blockhash the cluster has already aged out builds fine and fails at send time.
      required:
        - authority
        - asset
        - recipient
        - tokenStandard
      description: Moves an asset between wallets. Spans Solana and EVM — which fields apply depends on `tokenStandard`. `objkt` (Tezos) is not supported on this route.
    TransferTxResponse:
      type: object
      properties:
        tx:
          type: string
          description: base64 Solana VersionedTransaction (Solana standards)
        evm:
          $ref: "#/components/schemas/EvmUnsignedTx"
      description: Transfer payload. Exactly one of `tx` (Solana) or `evm` (EVM) is present, selected by the request's `tokenStandard`.
    TxFees:
      type: object
      properties:
        mint:
          type: number
        edit:
          type: number
        externalMarketBuy:
          type: number
        airdrop:
          type: number
        jellybeanPrint:
          type: number
        candyMachineBps:
          type: number
      required:
        - mint
        - edit
        - externalMarketBuy
        - airdrop
        - jellybeanPrint
        - candyMachineBps
    TxFeesResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/TxFees"
      required:
        - result
    UnlockableContentMine:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        assetUrl:
          type: string
        thumbnailUrl:
          type: string
        bundledContentIds:
