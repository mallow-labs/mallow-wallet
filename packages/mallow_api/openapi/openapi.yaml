      summary: Fixed-price buy
      description: |-
        Builds a purchase of `asset` at its listed price, signed and paid for by `buyer`.

        `maxPrice` is a slippage guard — the buy fails rather than filling if the listing price exceeds it.

        The buyer pays in the listing's currency. A listing denominated in USDC is bought by spending the buyer's own USDC — no `swapQuote`, no extra setup.

        **`swapQuote` is only for paying with a different token than the listing asks for** — SOL for a USDC listing, or vice versa. Fetch a Jupiter quote for `inputMint=<the token you want to spend>`, `outputMint=<the listing's currencyMint>` and pass it through. The quote's `outputMint` must match the listing currency and must yield enough to cover the price, or the request `400`s. The buyer remains the sole signer and fee payer.

        Listings gated by a whitelist reject buyers who are not on it.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
