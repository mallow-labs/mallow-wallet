# Sized for the smallest machine expected to build this, not the largest. At
# -Xmx8G plus a 4G metaspace the Gradle daemon alone can reserve 12G, which the
# Kotlin and Dart daemons then compete with — enough to get the build OOM-killed
# on a hosted CI runner or a 16GB laptop. These are the Flutter template
# defaults; raise them locally if you have the memory, do not raise them here.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
